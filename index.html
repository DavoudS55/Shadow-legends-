<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shadow Legends</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <header class="header">
        <div class="logo">
            <span class="logo-mark">S</span>
            <span>SHADOW LEGENDS</span>
        </div>
    </header>

    <main class="container">

        <!-- LIVE -->
        <section class="custom-section">

            <div class="section-header">
                <div class="section-title">
                    <span class="section-indicator live-indicator"></span>
                    <h2>LIVE CUSTOMS</h2>
                </div>

                <span class="section-count" id="liveCount">0</span>
            </div>

            <div class="custom-grid" id="liveCustoms">
                <!-- Live customs inserted by JS -->
            </div>

        </section>


        <!-- UPCOMING -->
        <section class="custom-section">

            <div class="section-header">
                <div class="section-title">
                    <span class="section-indicator upcoming-indicator"></span>
                    <h2>UPCOMING CUSTOMS</h2>
                </div>

                <span class="section-count" id="upcomingCount">0</span>
            </div>

            <div class="custom-grid" id="upcomingCustoms">
                <!-- Upcoming customs inserted by JS -->
            </div>

        </section>

    </main>


    <!-- REGISTER MODAL -->
    <div class="modal-overlay" id="registerModal">

        <div class="modal">

            <button class="close-button" id="closeRegister">
                ×
            </button>

            <div class="modal-header">
                <span class="modal-label">REGISTRATION</span>
                <h2 id="registerTitle">Custom</h2>
            </div>

            <form id="registrationForm">

                <input type="hidden" id="customId">

                <div class="form-group">
                    <label for="telegram">Telegram ID</label>
                    <input
                        type="text"
                        id="telegram"
                        placeholder="@username"
                        autocomplete="off"
                        required
                    >
                    <small>Must start with @</small>
                </div>

                <div class="form-group">
                    <label for="gameId">Game ID</label>
                    <input
                        type="text"
                        id="gameId"
                        placeholder="1234567890"
                        inputmode="numeric"
                        maxlength="10"
                        autocomplete="off"
                        required
                    >
                    <small>Exactly 10 digits</small>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>

                    <select id="role" required>
                        <option value="">Select role</option>
                        <option value="EXP Lane">EXP Lane</option>
                        <option value="Jungle">Jungle</option>
                        <option value="Mid Lane">Mid Lane</option>
                        <option value="Gold Lane">Gold Lane</option>
                        <option value="Roam">Roam</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rank">Highest Rank</label>

                    <select id="rank" required>
                        <option value="">Select rank</option>
                        <option value="Epic">Epic</option>
                        <option value="Legend">Legend</option>
                        <option value="Mythic">Mythic</option>
                        <option value="Mythical Honor">Mythical Honor</option>
                        <option value="Mythical Glory">Mythical Glory</option>
                        <option value="Mythical Immortal">Mythical Immortal</option>
                    </select>
                </div>

                <div class="form-group stars-group" id="starsGroup">

                    <label for="stars">Stars</label>

                    <input
                        type="number"
                        id="stars"
                        min="0"
                        max="999"
                        placeholder="0"
                    >

                </div>

                <div class="form-error" id="formError"></div>

                <button type="submit" class="register-submit">
                    REGISTER
                </button>

            </form>

        </div>

    </div>


    <!-- SUCCESS MODAL -->
    <div class="modal-overlay" id="successModal">

        <div class="modal success-modal">

            <div class="success-icon">✓</div>

            <span class="modal-label">REGISTRATION COMPLETE</span>

            <h2>You are registered</h2>

            <p id="successText"></p>

            <button class="register-submit" id="closeSuccess">
                DONE
            </button>

            <button class="cancel-link" id="cancelRegistration">
                Cancel registration
            </button>

        </div>

    </div>


    <!-- DETAILS MODAL -->
    <div class="modal-overlay" id="detailsModal">

        <div class="modal">

            <button class="close-button" id="closeDetails">
                ×
            </button>

            <span class="modal-label">CUSTOM DETAILS</span>

            <h2 id="detailsTitle"></h2>

            <div class="details-list">

                <div class="detail-row">
                    <span>Status</span>
                    <strong id="detailsStatus"></strong>
                </div>

                <div class="detail-row">
                    <span>Players</span>
                    <strong id="detailsPlayers"></strong>
                </div>

                <div class="detail-row">
                    <span>Match Start</span>
                    <strong id="detailsStart"></strong>
                </div>

                <div class="detail-row">
                    <span>Registration</span>
                    <strong id="detailsRegistration"></strong>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
